name: Fetch GitHub Trending

on:
  schedule:
    - cron: '0 16 * * *'    # 每天 北京00:00 → today
    - cron: '0 16 * * 1'    # 每周一 → this week
    - cron: '0 16 1 * *'    # 每月1号 → this month
  workflow_dispatch:
    inputs:
      period:
        description: '抓取时段（date range）'
        type: choice
        options: [daily, weekly, monthly]
        default: daily

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Determine period
        id: period
        run: |
          if [ -n "${{ inputs.period }}" ]; then
            echo "p=${{ inputs.period }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "0 16 * * 1" ]; then
            echo "p=weekly" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "0 16 1 * *" ]; then
            echo "p=monthly" >> $GITHUB_OUTPUT
          else
            echo "p=daily" >> $GITHUB_OUTPUT
          fi

      - name: Fetch trending and archive
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: python scripts/fetch_trending.py ${{ steps.period.outputs.p }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "chore: update ${{ steps.period.outputs.p }} trending $(date -u +%Y-%m-%d)"
          git push
