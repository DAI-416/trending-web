name: Fetch GitHub Trending

on:
  schedule:
    - cron: '0 16 * * *'  # UTC 16:00 = 北京时间 00:00，每天跑一次
  workflow_dispatch:       # 支持手动触发

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Fetch trending and archive
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: python scripts/fetch_trending.py auto

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "chore: update trending data $(date -u +%Y-%m-%d)"
          git push
